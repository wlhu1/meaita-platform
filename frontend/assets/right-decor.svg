<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 900" width="440" height="900">
  <defs>
    <linearGradient id="g1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#c9dcf7" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#e8f1fc" stop-opacity="0.2"/>
    </linearGradient>
    <linearGradient id="g2" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#9bbce9" stop-opacity="0.0"/>
      <stop offset="1" stop-color="#6f9fdc" stop-opacity="0.55"/>
    </linearGradient>
  </defs>

  <!-- 淡蓝函数曲线 y = sin(x) -->
  <g fill="none" stroke="#7fa8dd" stroke-width="2.2" opacity="0.55">
    <path d="M 20 220 Q 80 140 140 220 T 260 220 T 380 220" />
  </g>
  <g fill="none" stroke="#a5c2e8" stroke-width="1.4" opacity="0.5" stroke-dasharray="4 6">
    <path d="M 20 260 Q 80 200 140 260 T 260 260 T 380 260" />
  </g>
  <!-- 坐标轴线 -->
  <g stroke="#b8cfe9" stroke-width="1" opacity="0.5">
    <line x1="20" y1="300" x2="400" y2="300"/>
    <line x1="60" y1="180" x2="60" y2="360"/>
  </g>

  <!-- 书页图标（简洁线条） -->
  <g transform="translate(80,430)" fill="none" stroke="#7fa8dd" stroke-width="2.2" opacity="0.6">
    <path d="M 0 20 Q 60 0 120 20 L 120 160 Q 60 140 0 160 Z" />
    <path d="M 60 10 L 60 150" />
    <line x1="18" y1="45" x2="48" y2="38"/>
    <line x1="18" y1="75" x2="48" y2="68"/>
    <line x1="72" y1="38" x2="108" y2="45"/>
    <line x1="72" y1="68" x2="108" y2="75"/>
  </g>

  <!-- 教育主题文字（竖排淡色） -->
  <g fill="#5b86c4" opacity="0.32" font-family="SimSun, serif" font-size="34" letter-spacing="8">
    <text x="330" y="500">立</text>
    <text x="330" y="550">德</text>
    <text x="330" y="600">树</text>
    <text x="330" y="650">人</text>
  </g>
  <g fill="#89a8d4" opacity="0.28" font-family="SimSun, serif" font-size="22" letter-spacing="6">
    <text x="290" y="500">教书育人</text>
  </g>

  <!-- 底部淡几何装饰 -->
  <circle cx="120" cy="780" r="70" fill="none" stroke="#c2d6f0" stroke-width="1.4" opacity="0.5"/>
  <circle cx="120" cy="780" r="48" fill="none" stroke="#cfe0f6" stroke-width="1.2" opacity="0.5"/>
  <path d="M 250 820 L 360 820 L 330 760 Z" fill="none" stroke="#b8cfe9" stroke-width="1.6" opacity="0.45"/>
</svg>
