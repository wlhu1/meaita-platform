<main class="main" id="home"><section class="hero" aria-label="平台介绍"><h1>ME-AITA 教师成长智能体</h1><p class="subtitle">AI 赋能基础教育 · 智慧引领教师成长</p><p class="motto">学用相生 · 研创贯通 · 共建更好的教育未来</p></section>
<section class="chat-shell" aria-label="智能问答区"><div class="chat-card" id="chatCard"><div class="greeting"><div class="robot" aria-hidden="true"><i></i></div><div class="hello"><h2>你好！我是 ME-AITA 教师成长智能体</h2><p>我可以为您提供教学设计、课题研究、教师发展、教育政策解读等多方面的支持，<br class="desktop-break"/>有任何问题欢迎随时向我提问！</p></div></div><div class="chat-history" id="chatHistory" aria-live="polite" aria-label="对话记录"></div><div class="session-bar" id="sessionBar"><span class="session-label">当前会话</span><select id="sessionSelect" aria-label="历史会话"></select><button type="button" class="chip-btn" id="newSessionBtn" aria-label="新建会话">＋ 新建会话</button><button type="button" class="chip-btn danger" id="delSessionBtn" aria-label="删除当前会话">🗑 删除</button></div><form class="chat-compose" id="chatForm"><label for="ask" class="sr-only" style="position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0)">输入您的问题</label><textarea id="ask" placeholder="请输入您的问题，例如：如何利用AI设计一堂初中数学课？" rows="2" required></textarea><div class="compose-bottom"><div class="controls"><button type="button" class="chip-btn" id="modelToggle" aria-label="当前模型">✧ <span id="modelName">加载中…</span></button><button type="button" class="chip-btn" id="searchToggle" aria-pressed="false">◎ 联网搜索</button></div><button class="send" type="submit" aria-label="发送消息" id="sendBtn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m22 2-7 20-4-9-9-4Z"/><path d="M22 2 11 13"/></svg></button></div></form><div class="samples" id="samples"><span class="hint">你可以试试：</span><button class="sample" data-question="如何设计一个跨学科的项目式学习活动？">如何设计一个跨学科的项目式学习活动？</button><button class="sample" data-question="生成一份初中数学单元教学设计">生成一份初中数学单元教学设计</button><button class="sample" data-question="教师如何开展课例研究？">教师如何开展课例研究？</button><button class="sample" data-question="AI在课堂教学中的应用案例">AI在课堂教学中的应用案例</button></div></div></section>
<section class="feature-grid" aria-label="快捷功能入口"><button class="feature blue" data-feature="智能问答"><span class="feature-icon" aria-hidden="true">☏</span><span class="feature-text"><h3>智能问答</h3><p>教学设计 · 政策解读<br/>问题咨询 · 专业发展</p></span><span class="arrow" aria-hidden="true">›</span></button><button class="feature purple" data-feature="数字素养诊断"><span class="feature-icon" aria-hidden="true">▥</span><span class="feature-text"><h3>数字素养诊断</h3><p>了解能力现状<br/>获取发展建议</p></span><span class="arrow" aria-hidden="true">›</span></button><button class="feature teal" data-feature="优质资源推荐"><span class="feature-icon" aria-hidden="true">▤</span><span class="feature-text"><h3>优质资源推荐</h3><p>精品课程 · 研究文献<br/>工具资源 · 实践案例</p></span><span class="arrow" aria-hidden="true">›</span></button></section><p class="footnote">ME-AITA 教师成长智能体 · 河南大学 · 已接入智谱大模型（本地部署版）</p></main>
